AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Connector Validation infrastructure - DynamoDB, S3, EventBridge, Lambda, SQS DLQ

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  ValidationTableName:
    Type: String
    Default: agentcore-connector-validations
  ReportsBucketName:
    Type: String
    Default: agentcore-validation-reports

Globals:
  Function:
    Timeout: 60
    Runtime: nodejs20.x
    MemorySize: 256
    Environment:
      Variables:
        VALIDATION_TABLE: !Ref ValidationTable
        VALIDATION_REPORTS_BUCKET: !Ref ValidationReportsBucket
        CB_FAILURE_THRESHOLD: '5'
        CB_RECOVERY_TIMEOUT_MS: '60000'

Resources:
  # DynamoDB Table — Single-table design
  ValidationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ValidationTableName}-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1-AgentTimeline
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2-ConnectorType
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Service
          Value: connector-validation
        - Key: Environment
          Value: !Ref Environment

  # S3 Bucket — Validation reports with lifecycle
  ValidationReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ReportsBucketName}-${Environment}-${AWS::AccountId}'
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToIA
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
          - Id: ExpireOldReports
            Status: Enabled
            ExpirationInDays: 90
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Service
          Value: connector-validation
        - Key: Environment
          Value: !Ref Environment

  # EventBridge Event Bus
  ValidationEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub 'validation-events-${Environment}'
      Tags:
        - Key: Service
          Value: connector-validation

  # EventBridge Rule — triggers Lambda
  ValidationEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub 'connector-validation-rule-${Environment}'
      EventBusName: !Ref ValidationEventBus
      EventPattern:
        source:
          - agentcore.console
        detail-type:
          - ConnectorValidationRequested
      Targets:
        - Id: ConnectorValidatorLambda
          Arn: !GetAtt ConnectorValidatorFunction.Arn
          DeadLetterConfig:
            Arn: !GetAtt ValidationDLQ.Arn

  # SQS Dead Letter Queue
  ValidationDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'connector-validation-dlq-${Environment}'
      MessageRetentionPeriod: 1209600  # 14 days
      Tags:
        - Key: Service
          Value: connector-validation
        - Key: Environment
          Value: !Ref Environment

  # Lambda Function
  ConnectorValidatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'connector-validator-${Environment}'
      CodeUri: ../../lambda/connector-validator/
      Handler: index.handler
      Description: Validates connector configurations through a multi-stage pipeline
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt ValidationDLQ.Arn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ValidationTable
        - S3CrudPolicy:
            BucketName: !Ref ValidationReportsBucket
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:agentcore/*'
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: !Sub 'arn:aws:iam::*:role/agentcore-connector-*'
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: '*'
      Events:
        ValidationEvent:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref ValidationEventBus
            Pattern:
              source:
                - agentcore.console
              detail-type:
                - ConnectorValidationRequested
      Tags:
        Service: connector-validation
        Environment: !Ref Environment

  # Permission for EventBridge to invoke Lambda
  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ConnectorValidatorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ValidationEventRule.Arn

  # Permission for EventBridge to send to DLQ
  DLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ValidationDLQ
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ValidationDLQ.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt ValidationEventRule.Arn

Outputs:
  ValidationTableName:
    Description: DynamoDB table for validation records
    Value: !Ref ValidationTable
  ValidationTableArn:
    Description: DynamoDB table ARN
    Value: !GetAtt ValidationTable.Arn
  ReportsBucketName:
    Description: S3 bucket for validation reports
    Value: !Ref ValidationReportsBucket
  EventBusName:
    Description: EventBridge bus for validation events
    Value: !Ref ValidationEventBus
  EventBusArn:
    Description: EventBridge bus ARN
    Value: !GetAtt ValidationEventBus.Arn
  LambdaFunctionArn:
    Description: Connector validator Lambda ARN
    Value: !GetAtt ConnectorValidatorFunction.Arn
  DLQUrl:
    Description: Dead letter queue URL
    Value: !Ref ValidationDLQ
  DLQArn:
    Description: Dead letter queue ARN
    Value: !GetAtt ValidationDLQ.Arn
